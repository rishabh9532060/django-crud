
        {% extends 'books/base.html' %}
        {%block content%}
        <a href="{% url 'book_create' %}" class="btn btn-success">Add Book</a>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Price</th>
                    <th scope="col">Published Date</th>
                    <th scope="col">Action</th>

                </tr>
            </thead>
            <tbody>
                {%for i in books%}
                <tr>
                    <th scope="row">{{ i.title }}</th>
                    <td>{{ i.author }}</td>
                    <td>{{ i.price }}</td>
                    <td>{{ i.published_date }}</td>
                    <td>
                        <a href="{% url 'book_edit' i.id  %}" class="btn btn-primary">Edit</a>
                        <a href="{%  url 'book_delete' i.id %}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
                {%endfor%}
             
            
            </tbody>
        </table>
        {%endblock%}
